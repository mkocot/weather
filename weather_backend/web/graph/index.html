<body>

  <script src="uPlot.iife.js"></script>
  <style>
    .uplot {
      /* background: #eee; */
    }
    body {
      background: #eee;
    }
  </style>

  <script type="text/javascript">
    var data = {};
    var sensorid = "e09806259a66";
    var sensorid2 = "24a1603048ba";
    var sensoridOut = "ec62609d4998";
    var sensors = {
      [sensorid]: { colour: "red" },
      [sensorid2]: { colour: "green" },
      [sensoridOut]: { colour: "blue" }
    };

    function absolute_humidity(t, p, h) {
      if (!t || !p || !h) {
        return null;
      }
      // https://planetcalc.com/2167/
      Rw = 461.52 // J/(kgK)
      ew_t = 6.112*Math.exp((17.62*t)/(243.12+t))
      f_p = 1.0016 + (3.15E-6*p)-(0.074/p)
      A = h * f_p * ew_t
      B = (Rw * (t+ 273.15))
      return (A/B) * 1000
    }
    function dew_point(t, h) {
      if (!t || !h) {
        return null;
      }
      // https://en.wikipedia.org/wiki/Dew_point
      a = 17.625
      b = 243.04
      F = a*t/(b + t) + Math.log(h)
      return b*F / (a - F)
    }
    function zip(arrays) {
      // https://stackoverflow.com/questions/4856717/javascript-equivalent-of-pythons-zip-function
      return arrays[0].map(function(_,i){
        return arrays.map(function(array){return array[i]})
      });
    }
    function create_timepoints(_data) {
      // check for 
      var timepoints = new Array(_data.clock.count);
      for (i = 0; i < _data.clock.count; ++i) {
        timepoints[i] = (_data.clock.start + _data.clock.tick * i);
      }
      return timepoints;
    }
    
    function create_timepoints_v2(_data) {
      var timestamps = Array();
      for (key in _data) {
        if (key == 'clock') {
          continue;
        }
        timestamps = timestamps.concat(_data[key]['timestamp']);
      }
      timestamps = [...new Set(timestamps)].sort();

      // now go once more and create indices
      timestamp_to_data = {}

      for (key in _data) {
        if (key == 'clock') {
          continue
        }

        known_sensors = Object.keys(_data[key]).filter((v) => v != 'timestamp' && v != 'clock');

        remaped_values = Array();
        for (_ in known_sensors) {
          remaped_values.push(Array());
        }

        last_good_index = -1;
        for (i = 0; i < timestamps.length; ++i) {
          value = timestamps[i];
          index = _data[key]['timestamp'].indexOf(value);

          known_sensors.map((sensor) => _data[key][sensor][index]).forEach((v, i) => {
            remaped_values[i].push(v);
          });

          if (index < 0) {
            continue;
          }

          // interpolate between last_good_index and index
          if (Math.abs(last_good_index - i) > 1) {
            known_sensors.forEach((_, idx) => {
              if (last_good_index < 0) {
                start_value_index = i;
                start_index = 0;
              } else {
                start_value_index = last_good_index;
                start_index = last_good_index;
              }

              const last_good_value = remaped_values[idx][start_value_index];
              if (last_good_value === null) {
                return;
              }
              
              const next_good_value = remaped_values[idx][i]
              if (next_good_value === null) {
                return;
              }

              for (j = start_index + 1; j < i; ++j) {
                step = (j - start_index) / (i - 1 - start_index);
                //console.log({step, 'a': j, 'b': i - 1});
                remaped_values[idx][j] = last_good_value * (1 - step) + step * next_good_value;
              }

            });
          }

          last_good_index = i;
        }

        // interpolate missing data

        known_sensors.forEach((sensor, index) => {
          _data[key][sensor] = remaped_values[index];
        })
        delete _data[key]['timestamp'];
      }

      return timestamps;
    }

    var xmlhttp = new XMLHttpRequest();
    var url = "data.json";
    xmlhttp.onreadystatechange = function() {
      if (!(this.readyState == 4 && this.status == 200)) {
	      return;
      }
      data = JSON.parse(this.responseText);
      console.log("Data fetched");
      console.log({data});

      var augmented = [];
      var width = window.innerWidth * 0.9 || 800;
      var timepoints = create_timepoints_v2(data);
      console.log({data});
      let default_fetch = (key) => {
      return () => [timepoints,
	      data[sensorid][key],
	      data[sensorid2][key],
	      data[sensoridOut][key]];
      };
      let graphs = [
        {
          title: "Temp [°C]",
          //fill: "rgba(200, 0, 0, 0.3)",
          unit: "°C",
          stroke: "red",
          fetch: default_fetch("temp"),
          resolution: 1
        },
        //{
        //  title: "Dew point [°C]",
        //  fill: "rgba(255, 128, 128, 0.3)",
        //  unit: "°C",
        //  stroke: "green",
        //  fetch: () => {
        //    dewpointer = (x) => zip([data[x]["temp"], data[x]["hum"]]).map((xx) => dew_point(xx[0], xx[1] * 0.01));
        //    return [timepoints, dewpointer(sensorid), dewpointer(sensorid2), dewpointer(sensoridOut)];
        //  },
        //  customize: (o) => { o.series[3].show = true; }
        //},
        {
          title: "Humidity [%]",
          //fill: "rgba(0, 0, 255, 0.3)",
          unit: "%",
          stroke: "blue",
          fetch: default_fetch("hum")
        },
        {
          title: "Absolute Humidity [g/m³]",
          //fill: "rgba(0, 128, 128, 0.3)",
          unit: "g/m³",
          stroke: "rgb(0, 255, 255)",
          fetch: () => {
	          mapper = (x) => absolute_humidity(x[0], x[1], x[2]);
      	    humidifier = (x) => zip([data[x]["temp"], data[x]["pres"], data[x]["hum"]]).map(mapper);
	          return [timepoints, humidifier(sensorid), humidifier(sensorid2), humidifier(sensoridOut)];
	        }
        },
        {
          title: "Pressure [hPa]",
          //fill: "rgba(0, 255, 255, 0.3)",
          unit: "hPa",
          stroke: "purple",
          fetch: default_fetch("pres")
        },
        {
          title: "Bat [V]",
          //fill: "rgba(128, 64, 64, 0.3)",
          unit: "V",
          stroke: "gray",
          resolution: 2,
          fetch: default_fetch("volt"),
          customize: (o) => {
            o.series.splice(3, 1);
	        }
        }//,
        //{
        //  title: "Air Quality Index",
        //  fill: "rgba(64, 64, 64, 0.3)",
        //  unit: "",
        //  stroke: "navy",
        //  fetch: () => [timepoints, data[sensoridOut]["siaq"], 
        //   data[sensoridOut]["iaq"],    data[sensoridOut]["iaq"]],
        //  customize: (o) => {
        //    o.series[1].label = "Static IAQ";
        //    o.series[2].label = "IAQ";
        //    o.series.splice(3, 1);
        //  }
        //}
      ];
      let _spline = uPlot.paths.spline();
      let _linear = uPlot.paths.linear();
      let _mooSync = uPlot.sync("moo")
      const matchSyncKeys = (own, ext) => own == ext;
      let opts = {
        title: "Temp [°C]",
        id: "chart1",
        class: "my-chart",
        width: width,
        height: 200,
        cursor: {
          lock: true,
          //focus: {
          //  prox: 16
          //},
          sync: {
            key: _mooSync.key,
            setSeries: true,
            match: [matchSyncKeys, matchSyncKeys, matchSyncKeys],
          }
        },
        scales: {
          "V": {
            auto: false,
            range: [1.5, 3]
          }
        },
        series: [
          { value: "{YYYY}/{MM}/{DD} {HH}:{mm}:00" },
          {
            // initial toggled state (optional)
            show: true,

            spanGaps: true,

            // in-legend display
            label: "Sensor 1",
            stroke: "Chocolate",
            paths: _spline,

            // series style
            width: 2
          },
          {
            label: "Sensor 2",
            show: true,
            spanGaps: true,
            stroke: "DarkCyan",
            paths: _spline,
            value: (self, rawValue) => self.series[1].value(self, rawValue),
            width: 2
          },
          {
            label: "Sensor O",
            show: true,
            spanGaps: true,
            stroke: "Blue",
            paths: _linear,
            value: (self, rawValue) => self.series[1].value(self, rawValue),
            width: 2
          }
        ],
      };
      graphs.forEach((cfg) => {
        series_data = cfg.fetch();

        let resolution = cfg.resolution || 0;
        copts = {...opts};
        copts.title = cfg.title;
        copts.series.forEach((x, idx) => {
          // ignore time series
          if (idx == 0) {
            return;
          }
          // that's should be default but somehow isn't
          //x.stroke = "black";
          // addig "scale" prop will remove axis values on the left
          //if (cfg.title == "Bat [V]") {
          //  x.scale = "V";
          //}
        });
        copts.series[1].value = (self, rawValue) => !rawValue && "??" || rawValue.toFixed(resolution) + cfg.unit;
        cfg.customize && cfg.customize(copts);
        var uplot = new uPlot(copts, series_data, document.body);
        _mooSync.sub(uplot);
      })
    };
    xmlhttp.open("GET", url, true);
    xmlhttp.send();
  </script>
</body>
</html>
