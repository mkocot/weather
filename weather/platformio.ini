; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2-espnow

[common]
framework = arduino
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.2.2
	lowpowerlab/RFM69@^1.5.0
	adafruit/Adafruit BME680 Library@^2.0.2
	jgromes/RadioLib@^5.3.0
	boschsensortec/BSEC Software Library@^1.6.1480
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	arkhipenko/TaskScheduler@^3.6.0
	https://github.com/mkocot/arduino-crc8.git#1.0.3
	ayushsharma82/ElegantOTA@^3.1.1
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=gnu++17

[common-8266]
extends = common
platform = espressif8266
board = nodemcuv2


[common-esp32]
extends = common
platform = espressif32@6.4.0
board = esp32dev


[env:soil]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.2.2
	lowpowerlab/RFM69@^1.5.0
	adafruit/Adafruit BME680 Library@^2.0.2
	jgromes/RadioLib@^5.3.0
	boschsensortec/BSEC Software Library@^1.6.1480
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	arkhipenko/TaskScheduler@^3.6.0
	https://github.com/mkocot/arduino-crc8.git#1.0.3
	ayushsharma82/ElegantOTA@^3.1.1
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=gnu++17
	-DW_AC_TYPE=W_AC_DIRECT
	-DW_DEBUG=0
	-DW_BME=W_BME_OFF
	-DW_VERBOSE=1
	-DW_BLINK
	-DW_RADIO_MODE=W_RADIO_WIFI
	-DW_SOIL_MOISTURE
	-DW_WIFI_PACKET=W_WIFI_PACKET_MULTICAST
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1

[env:nodemcuv2-espnow]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.2.2
	boschsensortec/BSEC Software Library@^1.6.1480
	arkhipenko/TaskScheduler@^3.6.0
	https://github.com/mkocot/arduino-crc8.git#1.0.3
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=gnu++17
	-DW_AC_TYPE=W_AC_BATTERY
	-DW_BME=W_BME_280
	-DW_VERBOSE=1
	-DW_RADIO_MODE=W_RADIO_ESPNOW
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.2.2
	lowpowerlab/RFM69@^1.5.0
	adafruit/Adafruit BME680 Library@^2.0.2
	jgromes/RadioLib@^5.3.0
	boschsensortec/BSEC Software Library@^1.6.1480
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	arkhipenko/TaskScheduler@^3.6.0
	https://github.com/mkocot/arduino-crc8.git#1.0.3
	ayushsharma82/ElegantOTA@^3.1.1
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=gnu++17
	-DW_AC_TYPE=W_AC_BATTERY
	-DW_DEBUG
	-DW_BME=W_BME_280
	-DW_VERBOSE=1
	-DW_BLINK
	-DW_RADIO_MODE=W_RADIO_WIFI
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1

[env:esp32_remote_station_debug]
; pinpointing arduino-esp32 to 2.0.13 is fixing issue with hidden wifi
; borked from 2.0.14 onward
; still not fixed in 2.0.15
; or platform to 6.4.0 (borked from 6.5.0 onward due to above issue)
platform = espressif32@6.4.0
;platform_packages =
;    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#2.0.13

board = esp32dev
framework = arduino
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = ${this.upload_port}
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.2.2
	lowpowerlab/RFM69@^1.5.0
	adafruit/Adafruit BME680 Library@^2.0.2
	jgromes/RadioLib@^5.3.0
	boschsensortec/BSEC Software Library@^1.6.1480
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	arkhipenko/TaskScheduler@^3.6.0
	https://github.com/mkocot/arduino-crc8.git#1.0.3
	ayushsharma82/ElegantOTA@^3.1.1
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=gnu++17
	-DW_AC_TYPE=W_AC_DIRECT
	-DW_DEBUG
	-DW_BME=W_BME_TUNNEL_SPI
	-DW_VERBOSE=1
	-DW_BLINK
	-DW_RADIO_MODE=W_RADIO_HC12
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1

[env:esp32_remote_station]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = ${this.upload_port}
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.2.2
	lowpowerlab/RFM69@^1.5.0
	adafruit/Adafruit BME680 Library@^2.0.2
	jgromes/RadioLib@^5.3.0
	boschsensortec/BSEC Software Library@^1.6.1480
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	arkhipenko/TaskScheduler@^3.6.0
	https://github.com/mkocot/arduino-crc8.git#1.0.3
	ayushsharma82/ElegantOTA@^3.1.1
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=gnu++17
	-DW_AC_TYPE=W_AC_DIRECT
	-DW_DEBUG=0
	-DW_BME=W_BME_TUNNEL_SPI
	-DW_VERBOSE=0
	-DW_BLINK=1
	-DW_RADIO_MODE=W_RADIO_HC12
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
